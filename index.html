<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UNIST MLIC — 강화학습 1년 로드맵</title>
  <meta name="description" content="UNIST MLIC 신입생·인턴을 위한 1년 강화학습 로드맵. 기초1·2·3 → 연구분야 탐색 → 연구 시작을 페이지 단위로 정리." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#0c1222;--ink:#e7ecf4;--muted:#9aa3b2;--card:#11172a;--accent:#60a5fa;--ring:rgba(96,165,250,.35);--ok:#34d399;--warn:#fbbf24;--bad:#ef4444}
    @media (prefers-color-scheme: light){:root{--bg:#f6f7fb;--ink:#0f172a;--muted:#475569;--card:#ffffff;--accent:#2563eb;--ring:rgba(37,99,235,.25)}}
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:'Pretendard',system-ui,-apple-system,Segoe UI,Roboto,Apple SD Gothic Neo,Noto Sans KR,sans-serif}
    a{color:var(--accent);text-decoration:none}
    .layout{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
    @media (max-width:960px){.layout{grid-template-columns:1fr}.sidebar{position:sticky;top:0}}
    .sidebar{background:linear-gradient(180deg, rgba(255,255,255,.04), transparent), var(--card);border-right:1px solid rgba(148,163,184,.2);padding:18px}
    .brand{display:flex;align-items:center;gap:10px}
    .brand h1{font-size:18px;margin:0}
    .brand .sub{font-size:12px;color:var(--muted)}
    .nav{display:grid;gap:8px;margin-top:14px}
    .nav a{padding:10px 12px;border-radius:10px;border:1px solid transparent}
    .nav a.active,.nav a:hover{background:rgba(96,165,250,.08);border-color:rgba(96,165,250,.25);box-shadow:0 0 0 3px var(--ring)}
    .main{padding:20px 24px}
    .toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .btn{display:inline-flex;align-items:center;gap:8px;padding:9px 12px;border-radius:10px;border:1px solid rgba(148,163,184,.25);background:rgba(255,255,255,.03)}
    .btn:hover{border-color:var(--accent);box-shadow:0 0 0 3px var(--ring)}
    .container{max-width:1100px;margin:0 auto}
    h2{font-size: clamp(22px, 2.8vw, 30px);margin:0 0 10px}
    p.lead{color:var(--muted)}
    .grid{display:grid;gap:14px}
    .g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
    .g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
    @media (max-width:1000px){.g-2,.g-3{grid-template-columns:1fr}}
    .card{background:linear-gradient(180deg, rgba(255,255,255,.04), transparent 60%), var(--card); border:1px solid rgba(148,163,184,.18); border-radius:16px; padding:18px;}
    .kicker{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
    .badge{display:inline-flex;gap:6px;align-items:center;padding:4px 8px;border-radius:999px;border:1px solid rgba(148,163,184,.25);font-size:12px}
    .list{display:grid;gap:6px;margin:0;padding-left:18px}
    .list li{margin-left:6px}
    .mono{font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace}
    .small{font-size:12px;color:var(--muted)}
    .table{width:100%;border-collapse:collapse}
    .table th,.table td{border-bottom:1px solid rgba(148,163,184,.18);padding:8px 6px;text-align:left}
    .pill{display:inline-block;padding:2px 8px;border:1px dashed rgba(148,163,184,.35);border-radius:999px;font-size:12px;color:var(--muted)}
    .timeline{display:grid;gap:10px}
    .milestone{display:flex;gap:10px}
    .dot{width:10px;height:10px;border-radius:999px;background:var(--accent);margin-top:8px;flex:0 0 auto}
    footer{margin-top:24px;color:var(--muted)}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">
        <div style="width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#60a5fa,#34d399)"></div>
        <div>
          <h1>UNIST MLIC</h1>
          <div class="sub">RL 1‑Year Roadmap</div>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div style="margin-top:16px;display:grid;gap:8px">
        <a class="btn mono" href="https://mllab.unist.ac.kr/" target="_blank" rel="noreferrer">↗ Visit MLIC</a>
        <a class="btn mono" href="https://github.com/famouskawon/MLIC_roadmap/" target="_blank" rel="noreferrer">⚙️ Edit this site</a>
      </div>
      <p class="small" style="margin-top:12px">이선우, 이가원, 배준현 작성 (20251011)</p>
    </aside>

    <main class="main">
      <div class="container">
        <div class="toolbar" style="justify-content:space-between">
          <div>
            <h2 id="pageTitle">로드맵 개요</h2>
            <p class="lead">신입생·인턴이 12개월 동안 <strong>기초 → 응용 → 연구</strong>로 성장하도록 설계된 단계형 커리큘럼.</p>
          </div>
          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
            <span class="badge">⏱️ 1년</span>
            <span class="badge">🧑‍💻 PyTorch</span>
            <span class="badge">🧪 Gym/MuJoCo</span>
          </div>
        </div>

        <section id="content"></section>

        <footer>
          <p>© <span id="year"></span> UNIST MLIC. Maintained by <a id="owner" href="#">owner</a>.</p>
        </footer>
      </div>
    </main>
  </div>

  <script>
  // ====== 간단 설정 ======
  const OWNER_NAME = "your-name"; // 깃허브 유저명
  const REPO_NAME  = "mlic-rl-roadmap"; // 저장소명
  const OWNER_URL  = `https://github.com/${OWNER_NAME}`;
  const REPO_URL   = `https://github.com/${OWNER_NAME}/${REPO_NAME}`;

  // ====== 네비게이션/라우팅 정의 ======
  const PAGES = [
    { id: 'overview', label: '로드맵 개요' },
    { id: 'stage1',  label: '기초 공부 1' },
    { id: 'stage2',  label: '기초 공부 2' },
    { id: 'stage3',  label: '기초 공부 3' },
    { id: 'explore', label: '연구 분야 탐색' },
    { id: 'research',label: '연구 시작' },
    { id: 'schedule',label: '1년 타임라인' }
  ];

  // ====== 페이지 콘텐츠 데이터 (필요시 이 블록만 수정하세요) ======
  const DATA = {
    overview: {
      intro: `UNIST MLIC 신입생·인턴을 위한 1년 로드맵입니다. 각 단계는 명확한 학습 목표와 검증 기준을 포함하며,\n실습 중심으로 빠르게 기본기를 다진 뒤 연구에 착수하도록 설계했습니다.`,
      bullets: [
        '각 단계별: 학습 목표 · 강의 자료 · 참고 논문 · 과제/시험 · 성능 기준',
        '성능 기준은 재현 가능한 환경과 시드 3+ 평균으로 평가',
        '연구 주제는 실제 랩 과제와 연계, 베이스라인 재현부터 시작'
      ]
    },
    stage1: {
      title: '기초 공부 1 — MDP · MC/TD · Tabular Control (월 1–2)',
      goals: [
        'MDP, 반환(Return), 정책/가치, 벨만 방정식 개념 확립',
        'Monte‑Carlo / Temporal‑Difference 비교와 수식 유도',
        'Tabular SARSA / Q‑Learning 구현 및 수렴 경험'
      ],
      lectures: [
        {name:'Sutton & Barto 2e Ch.1–6', link:'#'},
        {name:'David Silver RL Course Lec 1–5', link:'#'},
        {name:'UCL RL(MP/DP, MC/TD)', link:'#'}
      ],
      papers: [
        {name:'Watkins & Dayan (1992) Q‑Learning', link:'#'},
        {name:'Sutton (1988) TD(λ)', link:'#'}
      ],
      exams: [
        '필기: 벨만 기대/최적 방정식 유도',
        '구현: Gridworld 정책평가/개선, CliffWalking SARSA vs Q‑Learning 비교'
      ],
      metrics: [
        'CliffWalking: 에피소드 길이·리턴 비교 그래프',
        'WindyGridworld: 최종 성공률 90%+, 시드 3 평균'
      ]
    },
    stage2: {
      title: '기초 공부 2 — 함수근사 · DQN · 안정화 (월 3–4)',
      goals: [
        '함수근사(신경망) 기반 가치학습 원리 이해',
        'Replay Buffer, Target Network, ε‑greedy 스케줄링',
        'DQN과 Double/ Dueling/ PER의 차이와 효과'
      ],
      lectures: [
        {name:'Spinning Up: Value‑based Methods', link:'#'},
        {name:'CleanRL: DQN 구현', link:'#'}
      ],
      papers: [
        {name:'Mnih et al. (2015) DQN', link:'#'},
        {name:'Hasselt (2010) Double Q‑learning', link:'#'},
        {name:'Schaul et al. (2016) PER', link:'#'},
        {name:'Wang et al. (2016) Dueling Network', link:'#'}
      ],
      exams: [
        '구현: CartPole DQN 재현(Replay/Target 포함)',
        '분석: ε 스케줄·타깃 업데이트 주기·배치 크기 ablation'
      ],
      metrics: [
        'CartPole‑v1: 100‑ep moving avg ≥ 475(시드 3+)',
        'LunarLander‑v2: 평균 점수 ≥ 200(선택)'
      ]
    },
    stage3: {
      title: '기초 공부 3 — 정책경사 · Actor‑Critic · PPO 맛보기 (월 5–6)',
      goals: [
        'REINFORCE, Baseline, Advantage의 역할',
        'Actor‑Critic(A2C/A3C) 개념 및 실습',
        'PPO의 핵심(Clipping, GAE) 맛보기'
      ],
      lectures: [
        {name:'Spinning Up: Policy Gradient · PPO', link:'#'},
        {name:'Berkeley Deep RL(선택): PG/Advantage', link:'#'}
      ],
      papers: [
        {name:'Williams (1992) REINFORCE', link:'#'},
        {name:'Schulman et al. (2017) PPO', link:'#'}
      ],
      exams: [
        '구현: REINFORCE로 CartPole 해결',
        '보고서: PG vs DQN 비교(학습 안정성·샘플효율)'
      ],
      metrics: [
        'CartPole‑v1: 성공률 95%+ 유지(시드 3+)',
        'LunarLander‑v2: 평균 ≥ 180 with A2C(선택)'
      ]
    },
    explore: {
      title: '연구 분야 탐색 — 논문 리딩 · 재현 · 벤치마크 (월 7–9)',
      goals: [
        '관심 분야(오프라인 RL, 분포형 RL, 메타RL, MTRL 등) 2~3개 선정',
        '핵심 논문 6~8편 심화 리딩 및 스터디 노트 작성',
        '오픈소스 베이스라인 1~2개 재현(CleanRL/rl-baselines3-zoo 등)'
      ],
      lectures: [
        {name:'UCL/DeepMind 고급 강의(선택)', link:'#'}
      ],
      papers: [
        {name:'Fujimoto et al. (2019) TD3', link:'#'},
        {name:'Haarnoja et al. (2018) SAC', link:'#'},
        {name:'Kostrikov et al. (2021) IQL(offline)', link:'#'},
        {name:'Mnih et al. (2016) A3C', link:'#'}
      ],
      exams: [
        '리딩시험: 논문 2편 요약·기여·제한점 설명(오픈북)',
        '재현: 선택한 알고리즘으로 2개 환경 결과 재현 + ablation 2개'
      ],
      metrics: [
        'MuJoCo HalfCheetah‑v3: SAC 평균 리턴 논문 대비 ≥90%',
        'Atari PongNoFrameskip‑v4: DQN ≥ +18(프레임스킵/No‑op 명시)'
      ]
    },
    research: {
      title: '연구 시작 — 문제정의 · 베이스라인 · 초기결과 (월 10–12)',
      goals: [
        '구체적 연구 질문과 가설 수립(측정 가능한 성공지표 포함)',
        '재현 가능한 코드베이스 정리(Seed 고정, 환경 버전 명시)',
        '초기 결과 + 오류 분석 + 다음 실험 계획 수립'
      ],
      lectures: [
        {name:'논문작성/실험설계 미니세미나', link:'#'}
      ],
      papers: [
        {name:'해당 분야 최신 2편(최근 2년)', link:'#'}
      ],
      exams: [
        '연구계획서 2~3p: 배경·문제·방법·지표·리스크·타임라인',
        '중간발표(10분): 베이스라인 재현 결과와 실패사례 공유'
      ],
      metrics: [
        'W&B/MLflow 로깅 정착(설정·시드·결과 표준화)',
        '재현 스크립트: README의 1‑커맨드 실행으로 결과 재현'
      ]
    },
    schedule: {
      title: '1년 타임라인',
      milestones: [
        {m:'월 1–2', t:'기초1 완료 · 수식유도/탭형 제어 실습'},
        {m:'월 3–4', t:'기초2 완료 · DQN 재현·Ablation'},
        {m:'월 5–6', t:'기초3 완료 · REINFORCE/PPO 맛보기'},
        {m:'월 7–9', t:'연구분야 탐색 · 베이스라인 1–2개 재현'},
        {m:'월 10–12', t:'연구 시작 · 계획서·초기결과·중간발표'}
      ]
    }
  };

  // ====== 렌더러 ======
  const elNav = document.getElementById('nav');
  const elContent = document.getElementById('content');
  const elTitle = document.getElementById('pageTitle');

  function navRender(){
    elNav.innerHTML = PAGES.map(p=>`<a href="#${p.id}" data-id="${p.id}">${p.label}</a>`).join('');
  }

  function setActive(id){
    [...elNav.querySelectorAll('a')].forEach(a=>{
      a.classList.toggle('active', a.dataset.id===id);
    })
  }

  function render(id){
    const page = DATA[id] || DATA.overview;
    setActive(id);
    if(id==='overview'){
      elTitle.textContent = '로드맵 개요';
      elContent.innerHTML = `
        <div class="card">
          <p>${page.intro.replace(/\n/g,'<br/>')}</p>
          <ul class="list">${page.bullets.map(x=>`<li>${x}</li>`).join('')}</ul>
        </div>
        <div class="grid g-3" style="margin-top:12px">
          ${PAGES.filter(p=>p.id!=='overview').slice(0,5).map(p=>`
            <a class="card" href="#${p.id}">
              <div class="kicker">Stage</div>
              <h3>${p.label}</h3>
              <p class="small">상세 페이지로 이동</p>
            </a>`).join('')}
        </div>`;
      return;
    }

    if(['stage1','stage2','stage3','explore','research'].includes(id)){
      elTitle.textContent = page.title;
      elContent.innerHTML = `
        <div class="grid g-2">
          <div class="card">
            <div class="kicker">학습 목표</div>
            <ul class="list">${page.goals.map(x=>`<li>${x}</li>`).join('')}</ul>
          </div>
          <div class="card">
            <div class="kicker">강의 자료</div>
            <ul class="list">${page.lectures.map(x=>`<li><a href="${x.link}">${x.name}</a></li>`).join('')}</ul>
          </div>
        </div>
        <div class="grid g-2" style="margin-top:12px">
          <div class="card">
            <div class="kicker">참고 논문</div>
            <ul class="list">${page.papers.map(x=>`<li><a href="${x.link}">${x.name}</a></li>`).join('')}</ul>
          </div>
          <div class="card">
            <div class="kicker">시험·과제</div>
            <ul class="list">${page.exams.map(x=>`<li>${x}</li>`).join('')}</ul>
          </div>
        </div>
        <div class="card" style="margin-top:12px">
          <div class="kicker">성능 기준(예)</div>
          <table class="table small mono">
            <thead><tr><th>항목</th><th>기준</th></tr></thead>
            <tbody>
              ${page.metrics.map(x=>`<tr><td>${x.split(':')[0]}</td><td>${x.split(':').slice(1).join(':')}</td></tr>`).join('')}
            </tbody>
          </table>
          <p class="small">* 모든 수치는 환경/프레임워크 버전과 시드(≥3) 평균을 보고서에 명시.</p>
        </div>`;
      return;
    }

    if(id==='schedule'){
      elTitle.textContent = DATA.schedule.title;
      elContent.innerHTML = `
        <div class="card">
          <div class="timeline">
            ${DATA.schedule.milestones.map(m=>`
              <div class="milestone"><div class="dot"></div><div><div class="mono pill">${m.m}</div><div>${m.t}</div></div></div>
            `).join('')}
          </div>
        </div>`;
      return;
    }
  }

  // ====== 부트스트랩 ======
  function boot(){
    // 네비
    navRender();
    // 링크 세팅
    document.getElementById('owner').href = OWNER_URL;
    document.getElementById('year').textContent = new Date().getFullYear();
    // 라우팅
    const onHash = ()=>{
      const id = location.hash.replace('#','') || 'overview';
      render(id);
    };
    window.addEventListener('hashchange', onHash);
    onHash();
  }
  boot();
  </script>
</body>
</html>
