      title: '1년 타임라인',
      milestones: [
        {m:'월 1–2', t:'기초1 — LaTeX·RL·수학 기초·퀴즈/구현 실습'},
        {m:'월 3–4', t:'기초2 — Basic RL 이론·DP/MC/TD·증명 스케치'},
        {m:'월 5–6', t:'기초3 — DQN/PG 계열 구현·분석'},
        {m:'월 7–9', t:'연구분야 탐색 — 논문 트리·재현'},
        {m:'월 10–12', t:'연구 시작 — 계획서·초기결과·중간발표'}
      ]
    }
  };

  // ====== 렌더러 ======
  const elNav = document.getElementById('nav');
  const elContent = document.getElementById('content');
  const elTitle = document.getElementById('pageTitle');

  function navRender(){
    elNav.innerHTML = PAGES.map(p=>`<a href="#${p.id}" data-id="${p.id}">${p.label}</a>`).join('');
  }
  function setActive(id){
    [...elNav.querySelectorAll('a')].forEach(a=>{
      a.classList.toggle('active', a.dataset.id===id);
    })
  }

  function render(id){
    const page = DATA[id] || DATA.overview;
    setActive(id);

    if(id==='overview'){
      elTitle.textContent = '로드맵 개요';
      elContent.innerHTML = `
        <div class="card">
          <p>${page.intro.replace(/\n/g,'<br/>')}</p>
          <ul class="list">${page.bullets.map(x=>`<li>${x}</li>`).join('')}</ul>
        </div>
        <div class="grid g-3" style="margin-top:12px">
          ${PAGES.filter(p=>p.id!=='overview').slice(0,5).map(p=>`
            <a class="card" href="#${p.id}">
              <div class="kicker">Stage</div>
              <h3>${p.label}</h3>
              <p class="small">상세 페이지로 이동</p>
            </a>`).join('')}
        </div>`;
      return;
    }

    if(['stage1','stage2','stage3','explore','research'].includes(id)){
      elTitle.textContent = page.title;
      elContent.innerHTML = `
        <div class="grid g-2">
          <div class="card">
            <div class="kicker">학습 목표</div>
            <ul class="list">${page.goals.map(x=>`<li>${x}</li>`).join('')}</ul>
          </div>
          <div class="card">
            <div class="kicker">강의 자료</div>
            <ul class="list">${page.lectures.map(x=>`<li><a href="${x.link}">${x.name}</a></li>`).join('')}</ul>
          </div>
        </div>
        <div class="grid g-2" style="margin-top:12px">
          <div class="card">
            <div class="kicker">참고 논문</div>
            <ul class="list">${page.papers.map(x=>`<li><a href="${x.link}">${x.name}</a></li>`).join('')}</ul>
          </div>
          <div class="card">
            <div class="kicker">시험·과제</div>
            <ul class="list">${page.exams.map(x=>`<li>${x}</li>`).join('')}</ul>
          </div>
        </div>
        <div class="card" style="margin-top:12px">
          <div class="kicker">성능 기준(예)</div>
          <table class="table small mono">
            <thead><tr><th>항목</th><th>기준</th></tr></thead>
            <tbody>
              ${page.metrics.map(x=>`<tr><td>${x.split(':')[0]}</td><td>${x.split(':').slice(1).join(':')}</td></tr>`).join('')}
            </tbody>
          </table>
          <p class="small">* 모든 수치는 환경/프레임워크 버전과 시드(≥3) 평균을 보고서에 명시.</p>
        </div>
        ${page.detailHtml ? `<div class="card" style="margin-top:12px">${page.detailHtml}</div>` : ''}
      `;
      return;
    }

    if(id==='schedule'){
      elTitle.textContent = DATA.schedule.title;
      elContent.innerHTML = `
        <div class="card">
          <div class="timeline">
            ${DATA.schedule.milestones.map(m=>`
              <div class="milestone"><div class="dot"></div><div><div class="mono pill">${m.m}</div><div>${m.t}</div></div></div>
            `).join('')}
          </div>
        </div>`;
      return;
    }
  }

  // ====== 부트스트랩 ======
  function boot(){
    navRender();
    const ownerEl = document.getElementById('owner');
    if (ownerEl) ownerEl.href = OWNER_URL;
    const repoEl = document.getElementById('repoBtn');
    if (repoEl) repoEl.href = REPO_URL;
    const editEl = document.getElementById('editBtn');
    if (editEl) editEl.href = `${REPO_URL}/edit/main/index.html`;
    const yearEl = document.getElementById('year');
    if (yearEl) yearEl.textContent = new Date().getFullYear();

    const onHash = ()=>{
      const id = location.hash.replace('#','') || 'overview';
      render(id);
    };
    window.addEventListener('hashchange', onHash);
    onHash();
  }
  boot();
  </script>
</body>
</html>
